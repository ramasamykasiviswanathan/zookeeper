version: "3.8"

services:
  zoo1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zoo1
    hostname: zoo1
    ports:
      - "2181:2181"
      - "5005:5005"
    environment:
      ZOO_MY_ID: 1
      ZOO_SERVERS: "server.1=zoo1:2888:3888 server.2=zoo2:2888:3888 server.3=zoo3:2888:3888 server.4=zoo4:2888:3888 server.5=zoo5:2888:3888"
      SERVER_JVMFLAGS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005 -Dzookeeper.test.delayPerOpcode=4:1:0,5:2:0,8:1:0"
    volumes:
      - zoo1_data:/data
      - zoo1_datalog:/logs

  zoo2:
