version: "3.8"

# Shared server JVM flags for every ZooKeeper member.
#
# `${VARIABLE-default}` uses the default only when VARIABLE is not set.
# An explicitly empty value is preserved:
#   unset/default                       -> no opcode delay (normal/baseline run)
#   ZOO_DELAY_PER_OPCODE='4:1:2,...'    -> delay the listed opcodes
#   ZOO_DELAY_STAGES='SERVER_RECV,...'  -> select effective request-aware stages
#   ZOO_DELAY_STAGES=''                 -> no stage filter (all effective request-aware stages)
x-zookeeper-environment: &zookeeper-environment
  SERVER_JVMFLAGS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=5005 -Dzookeeper.test.delayPerOpcode=${ZOO_DELAY_PER_OPCODE-} -Dzookeeper.test.delayStages=${ZOO_DELAY_STAGES-} -Dzookeeper.request_stale_latency_check=false"

services:
  zoo1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zoo1
    hostname: zoo1
    ports:
      - "2181:2181"
      - "5005:5005"
    environment:
      <<: *zookeeper-environment
      ZOO_MY_ID: 1
      ZOO_SERVERS: "server.1=zoo1:2888:3888 server.2=zoo2:2888:3888 server.3=zoo3:2888:3888 server.4=zoo4:2888:3888 server.5=zoo5:2888:3888"
    volumes:
      - zoo1_data:/data
      - ./logs/zoo1:/logs

  zoo2:
